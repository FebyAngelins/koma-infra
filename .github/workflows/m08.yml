# Pipeline image Modul 08: setiap versi layanan dibangun SEKALI di sini, diuji, lalu didorong ke
# registri koma-<nim>-m08-api dengan tag dari layanan/VERSI (tag tidak dapat ditimpa).
# Infrastruktur layanan (stack m08-layanan) memakai tag itu; tidak ada build di laptop.
#
#   push ke main (layanan/** berubah) atau jalankan manual -> uji -> build -> uji asap -> dorong
#
# Variabel repo yang dipakai (dari Modul 07): AWS_ROLE_ARN, KOMA_NIM.
name: m08-image

on:
  push:
    branches: [main]
    paths:
      - "layanan/**"
      - ".github/workflows/m08.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    name: uji layanan (tanpa AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uji unit
        run: python3 -m unittest discover -s layanan

  bangun-dan-dorong:
    name: build, uji asap, dorong ke ECR
    needs: uji
    runs-on: ubuntu-latest
    # Hanya job ini yang boleh meminta token OIDC ke GitHub (satu baris, gaya flow YAML).
    permissions: {contents: read, id-token: write}
    env:
      REPO: koma-${{ vars.KOMA_NIM }}-m08-api
    steps:
      - uses: actions/checkout@v4
      - name: Versi dari layanan/VERSI
        run: |
          VERSI="$(tr -d '[:space:]' < layanan/VERSI)"
          if ! echo "$VERSI" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::layanan/VERSI harus MAYOR.MINOR.PATCH, bukan '$VERSI'"; exit 1
          fi
          echo "VERSI=$VERSI" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --build-arg "VERSI=$VERSI" -t "layanan:$VERSI" layanan
      - name: Uji asap container (root filesystem baca-saja, seperti di ECS)
        run: |
          docker run -d --read-only --name uji -p 8080:8080 "layanan:$VERSI"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/versi | tee /dev/stderr | grep -q "\"versi\": \"$VERSI\""
          docker rm -f uji
      - name: Kredensial sementara lewat OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: koma-pipeline-${{ github.run_id }}
          aws-region: ap-southeast-2
      - name: Masuk ke ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tolak versi yang sudah ada
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids "imageTag=$VERSI" >/dev/null 2>&1; then
            echo "::error::$REPO:$VERSI sudah ada (tag tidak dapat ditimpa). Naikkan layanan/VERSI."; exit 1
          fi
      - name: Dorong
        run: |
          TUJUAN="${{ steps.ecr.outputs.registry }}/$REPO:$VERSI"
          docker tag "layanan:$VERSI" "$TUJUAN"
          docker push "$TUJUAN"
          echo "Didorong: $TUJUAN" >> "$GITHUB_STEP_SUMMARY"
